<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sruthi Travels - Hotel Booking</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff7fb;
    color: #1f1a20;
}

header {
    height: 64px;
    background: white;
    display: flex;
    align-items: center;
    padding: 0 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
    position: sticky;
    top: 0;
    z-index: 10;
}

header h1 {
    margin: 0;
    color: #732993;
    font-size: 22px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.hero {
    background: linear-gradient(135deg, #732993, #b32631);
    color: white;
    padding: 35px 25px;
    border-radius: 18px;
    text-align: center;
    margin-bottom: 25px;
}

.hero h2 {
    margin: 0 0 10px;
    font-size: 30px;
}

.hero p {
    margin: 0;
    font-size: 16px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 4px 15px rgba(45,52,54,.10);
}

.card h3 {
    color: #732993;
    margin-top: 0;
}

.service {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.service div {
    background: #f6eaf4;
    padding: 18px;
    border-radius: 12px;
    text-align: center;
    font-weight: bold;
}

input, select, textarea {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    margin-bottom: 14px;
    border: 1px solid #d1c2d2;
    border-radius: 8px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #732993;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #8e44ad;
}

.whatsapp {
    display: block;
    text-align: center;
    text-decoration: none;
    background: #00A870;
    color: white;
    padding: 14px;
    border-radius: 9px;
    margin-top: 12px;
    font-weight: bold;
}

.back {
    display: block;
    text-align: center;
    color: #732993;
    margin: 20px 0;
    text-decoration: none;
    font-weight: bold;
}

@media(max-width:600px) {
    .service {
        grid-template-columns: 1fr 1fr;
    }

    .hero h2 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Sruthi Travels</h1>
</header>

<div class="container">

    <section class="hero">
        <h2>Hotel Booking</h2>
        <p>Comfortable stays at destinations around the world.</p>
    </section>

    <section class="card">
        <h3>🏨 Our Hotel Services</h3>

        <div class="service">
            <div>🏨 Hotels</div>
            <div>🌍 International</div>
            <div>⭐ Premium Hotels</div>
            <div>💰 Best Rates</div>
        </div>
    </section>

    <section class="card">
        <h3>Book Your Hotel</h3>

        <form onsubmit="sendWhatsApp(); return false;">

            <label>Full Name</label>
            <input id="name" type="text" placeholder="Enter your name" required>

            <label>Mobile Number</label>
            <input id="phone" type="tel" placeholder="Enter mobile number" required>

            <label>Destination</label>
            <input id="destination" type="text" placeholder="City / Country" required>

            <label>Check-in Date</label>
            <input id="checkin" type="date" required>

            <label>Check-out Date</label>
            <input id="checkout" type="date" required>

            <label>Number of Guests</label>
            <select id="guests">
                <option>1 Guest</option>
                <option>2 Guests</option>
                <option>3 Guests</option>
                <option>4 Guests</option>
                <option>5+ Guests</option>
            </select>

            <button type="submit">
                Request Hotel Booking
            </button>

        </form>

        <a class="whatsapp"
           href="https://wa.me/919952772828"
           target="_blank">
           💬 WhatsApp: 9952772828
        </a>
    </section>

    <a class="back" href="index.html">
        ← Back to Home
    </a>

</div>

<script>
function sendWhatsApp() {

    let name = document.getElementById("name").value;
    let phone = document.getElementById("phone").value;
    let destination = document.getElementById("destination").value;
    let checkin = document.getElementById("checkin").value;
    let checkout = document.getElementById("checkout").value;
    let guests = document.getElementById("guests").value;

    let message =
        "🏨 *Hotel Booking Enquiry*%0A%0A" +
        "Name: " + name + "%0A" +
        "Mobile: " + phone + "%0A" +
        "Destination: " + destination + "%0A" +
        "Check-in: " + checkin + "%0A" +
        "Check-out: " + checkout + "%0A" +
        "Guests: " + guests;

    window.open(
        "https://wa.me/919952772828?text=" + message,
        "_blank"
    );
}
</script>

</body>
</html>
