<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chennai House Rent Listings | SRUTHI COMMUNICATION</title><style>:root{--g:#d4af37;--gl:#f4d675;--line:#4b3b18}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#000b,#000e),url('https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=1800&q=85') center/cover fixed;color:#fff}.wrap{width:92%;max-width:1100px;margin:auto}header{background:#050505f5;border-bottom:1px solid var(--line);padding:10px 0}.head{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:12px}.logo{height:52px;max-width:150px;object-fit:contain}.brand b{color:var(--gl);font-size:20px;letter-spacing:2px}.home{color:var(--gl);border:1px solid var(--g);padding:8px 13px;border-radius:7px;text-decoration:none}.hero{text-align:center;padding:42px 10px 25px}.hero h1{font-size:clamp(30px,6vw,48px);margin:10px}.gold{color:var(--g)}.hero p{color:#ccc}.switch{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:25px 0}.switch button{padding:12px 20px;background:#111;color:#ddd;border:1px solid var(--line);border-radius:7px;font-weight:bold;cursor:pointer}.switch button.active{background:var(--g);color:#000}.toolbar{background:#0d0d0df2;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:22px;display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px}.toolbar input,.toolbar select{padding:12px;background:#080808;color:#fff;border:1px solid #444;border-radius:6px}.toolbar button{background:var(--g);border:0;border-radius:6px;font-weight:bold;padding:12px 18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{background:#0f0f0ff5;border:1px solid var(--line);border-radius:13px;padding:20px}.tag{display:inline-block;color:#000;background:var(--g);padding:5px 9px;border-radius:20px;font-size:11px;font-weight:bold}.card h3{color:var(--gl);margin:12px 0 8px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #292929;padding:8px 0;color:#ccc}.rent{font-size:22px;color:#fff;font-weight:bold}.contact{display:block;text-align:center;background:linear-gradient(90deg,#b98b1b,#f4d675,#b98b1b);color:#000;text-decoration:none;font-weight:bold;padding:12px;border-radius:6px;margin-top:15px}.empty{text-align:center;color:#aaa;padding:35px;grid-column:1/-1}.hidden{display:none}footer{text-align:center;margin-top:55px;padding:24px;background:#050505;border-top:1px solid var(--line);color:#aaa}@media(max-width:700px){.toolbar{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.brand b{font-size:15px}.logo{height:43px;max-width:120px}.home{font-size:12px}}
</style></head><body><header><div class="wrap head"><div class="brand"><img class="logo" src="sruthi-logo.png" alt="SRUTHI COMMUNICATION"><b>SRUTHI COMMUNICATION</b></div><a class="home" href="houserent.html">← Register</a></div></header><section class="hero wrap"><div>🏠 CHENNAI ONLY</div><h1>House <span class="gold">Rent Listings</span></h1><p>Owners and Tenants can view matching Chennai rental information.</p><div class="switch"><button id="ownersBtn" class="active" onclick="show('owners')">🔑 Properties for Tenants</button><button id="tenantsBtn" onclick="show('tenants')">🏠 Requirements for Owners</button></div></section><main class="wrap"><div class="toolbar"><input id="area" placeholder="Search Chennai area"><select id="type"><option value="">All House Types</option><option>1 BHK</option><option>2 BHK</option><option>3 BHK</option><option>4 BHK</option><option>Villa</option><option>Independent House</option><option>Flat / Apartment</option><option>PG / Room</option></select><input id="max" type="number" min="0" placeholder="Max Rent / Budget ₹"><button onclick="loadData()">SEARCH</button></div><section id="owners"><div id="ownerGrid" class="grid"><div class="empty">Loading properties...</div></div></section><section id="tenants" class="hidden"><div id="tenantGrid" class="grid"><div class="empty">Loading requirements...</div></div></section></main><footer><b style="color:#d4af37">SRUTHI COMMUNICATION</b><br>Chennai House Rent Service<br><br>© 2026 All Rights Reserved</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://rfkmshlmphkntswpoqty.supabase.co','sb_publishable_ONHMYKFl2HOZbg-rwMUNeg_UindsvN6');let mode='owners';function show(x){mode=x;document.getElementById('owners').classList.toggle('hidden',x!=='owners');document.getElementById('tenants').classList.toggle('hidden',x!=='tenants');document.getElementById('ownersBtn').classList.toggle('active',x==='owners');document.getElementById('tenantsBtn').classList.toggle('active',x==='tenants');loadData()}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function cardOwner(x){return `<article class="card"><span class="tag">${esc(x.property_type||'PROPERTY')}</span><h3>🏠 ${esc(x.area)}</h3><div class="row"><span>Monthly Rent</span><b class="rent">₹${Number(x.rent||0).toLocaleString('en-IN')}</b></div><div class="row"><span>Advance / Deposit</span><span>₹${Number(x.advance_deposit||0).toLocaleString('en-IN')}</span></div><div class="row"><span>Available From</span><span>${esc(x.available_from||'—')}</span></div><div class="row"><span>Furnishing</span><span>${esc(x.furnishing||'—')}</span></div><div class="row"><span>Parking</span><span>${esc(x.parking||'—')}</span></div><div class="row"><span>Address</span><span>${esc(x.property_address||'Chennai')}</span></div><a class="contact" href="https://wa.me/919952772828?text=${encodeURIComponent('Hello SRUTHI COMMUNICATION, I am interested in a House Rent property in '+(x.area||'Chennai')+' ('+(x.property_type||'')+'). Please share details.')}">💬 Contact SRUTHI COMMUNICATION</a></article>`}function cardTenant(x){return `<article class="card"><span class="tag">TENANT REQUIREMENT</span><h3>🔑 ${esc(x.area)}</h3><div class="row"><span>House Type</span><b>${esc(x.property_type||'Any')}</b></div><div class="row"><span>Maximum Budget</span><b class="rent">₹${Number(x.max_budget||0).toLocaleString('en-IN')}</b></div><div class="row"><span>Move-in Date</span><span>${esc(x.move_in_date||'—')}</span></div><div class="row"><span>Tenant Type</span><span>${esc(x.tenant_type||'—')}</span></div><div class="row"><span>Furnishing</span><span>${esc(x.furnishing_required||'—')}</span></div><div class="row"><span>Requirements</span><span>${esc(x.additional_requirements||'—')}</span></div><a class="contact" href="https://wa.me/919952772828?text=${encodeURIComponent('Hello SRUTHI COMMUNICATION, I am an owner interested in a tenant requirement in '+(x.area||'Chennai')+' ('+(x.property_type||'')+'). Please share details.')}">💬 Contact SRUTHI COMMUNICATION</a></article>`}async function loadData(){let area=document.getElementById('area').value.trim(),type=document.getElementById('type').value,max=Number(document.getElementById('max').value||0);let q=db.from('house_rent_submissions').select('*').order('created_at',{ascending:false}).eq('submission_type',mode==='owners'?'owner':'tenant');if(area)q=q.ilike('area','%'+area+'%');if(type)q=q.eq('property_type',type);if(max){q=mode==='owners'?q.lte('rent',max):q.lte('max_budget',max)}let{data,error}=await q;let el=document.getElementById(mode==='owners'?'ownerGrid':'tenantGrid');if(error){el.innerHTML='<div class="empty">Unable to load listings. Please try again.</div>';return}if(!data.length){el.innerHTML='<div class="empty">No matching Chennai listings found yet.</div>';return}el.innerHTML=data.map(mode==='owners'?cardOwner:cardTenant).join('')}loadData();</script></body></html>
